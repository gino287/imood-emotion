# imood-emotion 的執行環境。
#   建置指令:
#   docker compose -f docker/docker-compose.yml build
# 三個服務：
#   app      BERT 情緒分類，掛 GPU
#   app-cpu  同一個 image，不掛 GPU 的對照組
#   stt      語音轉文字，另一個 image（依賴與 BERT 完全分開）


name: imood-emotion

x-common: &common
#app、app-cpu共用設定
  build:
    context: ..                 # 專案根目錄
    dockerfile: docker/dockerfile   # dockerfile路徑
  image: imood-emotion
  volumes:  
    - ..:/app
    #掛載路徑 
    - ${REFS_DIR:-./empty}:/refs:ro
    #抓取資料集路徑，如果無則退回empty

  env_file:
    - path: ../.env
      required: false
    #抓env
  working_dir: /app



services:
  # 主要服務：借用主機 GPU
  # 範例指令:#   docker compose -f docker/docker-compose.yml run --rm app \
            #   python baseline/run_baseline.py --device cuda --limit 200
  app:
    <<: *common
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # CPU 對照組
  # 範例指令:#   docker compose -f docker/docker-compose.yml run --rm app-cpu \
            #   python baseline/run_baseline.py --device cpu --limit 200
  app-cpu:
    <<: *common

  #前置模組STT語音轉文字
  # 範例指令:  #   docker compose -f docker/docker-compose.yml run --rm stt \
              #   python stt/transcribe.py 某個音檔.wav
  stt:
    build:
      context: ..
      dockerfile: docker/dockerfile.stt
    image: imood-emotion-stt
    volumes:
      - ..:/app
    env_file:
      - path: ../.env
        required: false
    working_dir: /app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
