# 兩個服務指向同一個 image，差別只在掛不掛 GPU。
#
#   docker compose build
#   docker compose run --rm app-cpu python run_stream.py --device cpu
#   docker compose run --rm app     python run_stream.py --device cuda

x-common: &common
  build:
    context: .
    dockerfile: dockerfile      # 檔名是小寫，Docker 預設找的是 Dockerfile，要講清楚
  image: imood-ai
  volumes:
    # 整個專案資料夾掛進去：改 .py 不用重 build，只有動到 requirements.txt 才要重 build。
    # HF_HOME 在 dockerfile 裡設成 /app/.cache/huggingface，落在這個掛載範圍內，
    # 所以主機直接跑 python 與容器內跑共用同一份模型快取，模型只下載一次。
    - .:/app
  env_file:
    # required: false —— 沒有 .env 也要能 build 能跑。
    # .env 不進版控（見 .env.example），少了這行新 clone 會直接失敗。
    - path: .env
      required: false
  working_dir: /app

services:
  # 主要服務：借用主機 GPU
  app:
    <<: *common
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # CPU 對照組。部署硬體未定，且這張 4GB 卡要與 pipeline 上的其他模型
  # （Moshi、JoyGen）共用，CPU 路線必須有數字備著。
  # 這個服務不掛 GPU，確保量到的是乾淨的 CPU 數字。
  app-cpu:
    <<: *common
